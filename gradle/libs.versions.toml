[versions]
# Pins the c4ds build-conventions plugin, which brings the SDK and the host's Kotlin/Compose
# versions with it. Keep `agp` on the version the host app is built with.
combat-ds-sdk = "0.5.5"
agp = "9.3.1"
# Only used by the serialization compiler plugin below; keep it on the Kotlin the conventions
# plugin brings, so the two cannot drift.
kotlin = "2.4.10"
androidx-room = "2.8.4"
google-ksp-plugin = "2.3.9"

[libraries]
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidx-room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
combat-plugin = { id = "vision.combat.c4.ds", version.ref = "combat-ds-sdk" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "google-ksp-plugin" }
